<div class="card p-4 animate-slide-up"
  [class.opacity-60]="task.status === 'DONE'">

  <div class="flex items-start gap-3">

    <!-- Checkbox done -->
    <button (click)="task.status === 'DONE' ? markInProgress.emit(task.id) : markDone.emit(task.id)"
      class="mt-0.5 flex-shrink-0 w-5 h-5 rounded border-2 flex items-center justify-center transition-colors"
      [class.border-primary-500]="task.status !== 'DONE'"
      [class.bg-primary-500]="task.status === 'DONE'"
      [class.border-primary-500]="task.status === 'DONE'"
      [attr.aria-label]="task.status === 'DONE' ? 'Rouvrir' : 'Terminer'">
      <svg *ngIf="task.status === 'DONE'" class="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
      </svg>
    </button>

    <!-- Contenu principal -->
    <div class="flex-1 min-w-0">

      <!-- Titre + badges -->
      <div class="flex flex-wrap items-center gap-2 mb-1">
        <h3 class="font-medium text-gray-900 dark:text-white text-sm leading-snug"
          [class.line-through]="task.status === 'DONE'"
          [class.text-gray-400]="task.status === 'DONE'">
          {{ task.title }}
        </h3>
        <!-- Priorité -->
        <span [class]="'badge-' + task.priority.toLowerCase()">
          {{ priorityLabels[task.priority] }}
        </span>
        <!-- Statut -->
        <span [class]="'status-' + task.status.toLowerCase()">
          {{ statusLabels[task.status] }}
        </span>
      </div>

      <!-- Description -->
      <p *ngIf="task.description"
        class="text-xs text-gray-500 dark:text-gray-400 mb-2 line-clamp-2">
        {{ task.description }}
      </p>

      <!-- Métadonnées -->
      <div class="flex flex-wrap items-center gap-3 text-xs">

        <!-- Catégorie -->
        <span class="flex items-center gap-1 text-gray-500 dark:text-gray-400">
          <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A2 2 0 013 12V7a2 2 0 012-2z"/>
          </svg>
          {{ task.category }}
        </span>

        <span *ngIf="subtaskLabel" class="text-indigo-600 dark:text-indigo-400 font-medium">{{ subtaskLabel }}</span>

        <!-- Échéance -->
        <span *ngIf="task.deadline" class="flex items-center gap-1" [class]="deadlineColor">
          <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
          {{ deadlineLabel }}
        </span>

        <!-- Date création -->
        <span class="text-gray-400 dark:text-gray-500 ml-auto">
          {{ task.created_at | date:'dd/MM/yyyy' }}
        </span>

      </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-1 flex-shrink-0">

      <!-- En cours -->
      <button *ngIf="task.status === 'TODO' || task.status === 'LATE'"
        (click)="markInProgress.emit(task.id)"
        title="Passer en cours"
        class="p-1.5 rounded-lg text-gray-400 hover:text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/30 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </button>

      <!-- Éditer -->
      <button (click)="edit.emit(task)"
        title="Modifier"
        class="p-1.5 rounded-lg text-gray-400 hover:text-primary-500 hover:bg-primary-50 dark:hover:bg-primary-900/30 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
      </button>

      <!-- Supprimer -->
      <button (click)="delete.emit(task.id)"
        title="Supprimer"
        class="p-1.5 rounded-lg text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
      </button>

    </div>
  </div>
</div>
