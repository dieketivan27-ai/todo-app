<header class="sticky top-0 z-40 bg-white border-b border-gray-100 shadow-sm">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">

    <!-- Logo & Titre -->
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center shadow-sm">
        <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
        </svg>
      </div>
      <div>
        <h1 class="text-lg font-bold text-gray-900 leading-none">MyGoals</h1>
        <p class="text-xs text-gray-400 leading-none mt-0.5">Objectifs & Productivité</p>
      </div>
    </div>

    <!-- Right side: User & Theme -->
    <div class="flex items-center gap-3">
      
      <!-- User profile -->
      <div class="hidden sm:flex items-center gap-3 bg-gray-50 border border-gray-100 rounded-xl px-3 py-1.5" *ngIf="auth.currentUser$ | async as user">
        <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 font-bold text-sm">
          {{ user.name.charAt(0).toUpperCase() }}
        </div>
        <div class="flex flex-col">
          <span class="text-sm font-semibold text-gray-800 leading-tight">{{ user.name }}</span>
          <button (click)="auth.logout()" class="text-xs text-gray-400 hover:text-red-500 text-left transition-colors">Déconnexion</button>
        </div>
      </div>

    </div>

  </div>
</header>
